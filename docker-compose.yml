services:
  postgres:
    image: postgres:16-alpine
    container_name: manu-agent-postgres

    environment:
      POSTGRES_USER: manu
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: manu_agent

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manu -d manu_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data: